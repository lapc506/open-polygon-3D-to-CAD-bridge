[workspace]
resolver = "2"
members = [
  "crates/cfd-core",
  "crates/cfd-openfoam",
  "apps/bridge-mcp",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
