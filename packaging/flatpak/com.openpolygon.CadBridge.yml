app-id: com.openpolygon.CadBridge
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: open-polygon-cad-bridge
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home

modules:
  - name: open-polygon-cad-bridge
    buildsystem: simple
    build-commands:
      - install -Dm755 target/release/bridge-studio /app/bin/open-polygon-cad-bridge
      - install -Dm755 target/release/bridge-mcp /app/bin/open-polygon-cad-mcp
      - install -Dm644 packaging/flatpak/com.openpolygon.CadBridge.desktop /app/share/applications/com.openpolygon.CadBridge.desktop
      - install -Dm644 packaging/flatpak/com.openpolygon.CadBridge.metainfo.xml /app/share/metainfo/com.openpolygon.CadBridge.metainfo.xml
      - install -Dm644 packaging/flatpak/com.openpolygon.CadBridge.svg /app/share/icons/hicolor/scalable/apps/com.openpolygon.CadBridge.svg
    sources:
      - type: dir
        path: ../..
